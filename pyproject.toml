[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rishi"
dynamic = ["version"]
description = "fast local llm driver with tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "huggingface-hub>=1.23.0",
    "safepyrun>=0.2.3",
    "toolslm>=0.3.0",
]

# Backends are opt-in: `rishi.core` is backend-agnostic, and a machine that only wants one engine
# shouldn't have to build the others. `Chat(model)` imports the backend it needs on demand.
[project.optional-dependencies]
litert = ["litert-lm-api>=0.14.0"]
llama = [
    "llama-cpp-python==0.3.30",  # pinned: abetlen's 0.3.33/0.3.34 metal wheels are corrupt upstream (bad internal CRCs)
    "soundfile>=0.14.0",
    "numpy",
]
# mlx is Apple-silicon only; the marker lets `rishi[all]` stay installable everywhere
mlx = ["mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# vision/audio MLX models; kept separate because mlx-vlm pulls opencv and friends
mlx-vlm = ["rishi[mlx]", "mlx-vlm>=0.6.8; sys_platform == 'darwin' and platform_machine == 'arm64'"]
all = ["rishi[litert,llama,mlx,mlx-vlm]"]
dev = ["rishi[litert,llama]"]   # what CI installs: every backend that builds on linux

[project.urls]
Repository = "https://github.com/vedicreader/rishi"
Documentation = "https://vedicreader.github.io/rishi/"

[project.entry-points.nbdev]
rishi = "rishi._modidx:d"

[tool.nbdev]

[tool.hatch.build.targets.wheel]
packages = ["rishi"]

[tool.hatch.build.targets.sdist]
include = ["/rishi", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "rishi/__init__.py"

[[tool.uv.index]]
name = "llama-metal"
url = "https://abetlen.github.io/llama-cpp-python/whl/metal"
explicit = true

[[tool.uv.index]]
name = "llama-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = [
    { index = "llama-metal", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { index = "llama-cpu", marker = "sys_platform != 'darwin' or platform_machine != 'arm64'" },
]

[dependency-groups]
dev = [
    "dhrishti>=0.0.5",
    "nbdev>=3.1.0",
    "notebook>=7.6.0",
    "pyskills>=0.0.21",
]
