[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rishi"
dynamic = ["version"]
description = "fast local llm driver with tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fastcore>=2.0.0",
    "huggingface-hub>=1.23.0",
    "safepyrun>=0.2.3",
    "truststore>=0.10",
    "liteparse<2.13"
]

[project.optional-dependencies]
litert = ["litert-lm-api>=0.14.0"]
remote = ["python-fastllm==0.0.41", "aidialog>=0.0.10"]
mlx = ["mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
mlx-vlm = [
    "mlx-vlm>=0.6.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
llama = [
    "llama-cpp-python==0.3.30",  # pinned: abetlen's 0.3.33/0.3.34 metal wheels are corrupt upstream (bad internal CRCs)
    "soundfile>=0.14.0",
    "numpy",
]
ollama = [
    "zstandard>=0.22; sys_platform == 'linux' and python_version < '3.14'",
]
copilot = ["rishi[remote]", "httpx",]
claude = ["claude-agent-sdk>=0.2",]
record = ["diskcache>=5.6.3",]
all = ["rishi[litert,remote,mlx,mlx-vlm,llama,ollama,claude,copilot,record]",]
dev = ["rishi[all]",]
[project.urls]
Repository = "https://github.com/vedicreader/rishi"
Documentation = "https://vedicreader.github.io/rishi/"

[project.entry-points.nbdev]
rishi = "rishi._modidx:d"

[tool.nbdev]

[tool.hatch.build.targets.wheel]
packages = ["rishi"]

[tool.hatch.build.targets.sdist]
include = ["/rishi", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "rishi/__init__.py"

[[tool.uv.index]]
name = "llama-metal"
url = "https://abetlen.github.io/llama-cpp-python/whl/metal"
explicit = true

[[tool.uv.index]]
name = "llama-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = [
    { index = "llama-metal", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { index = "llama-cpu", marker = "sys_platform != 'darwin' or platform_machine != 'arm64'" },
]

[dependency-groups]
dev = [
    "rishi[all]",
    "dhrishti>=0.0.5",
    "koshas>=0.0.31",
    "diskcache>=5.6.3",
    "nbdev>=3.1.0",
    "notebook>=7.6.0",
    "pyskills>=0.0.21",
    "ipykernel>=7.3.0",
]